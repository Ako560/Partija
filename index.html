<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ede6d8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Partija" />
  <meta name="description" content="Partija — scorekeeper za Trešetu, Briškulu, Kifameno i Remi." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script>
    (() => {
      let theme = 'light';
      try {
        const saved = JSON.parse(localStorage.getItem('karte-score.settings.v1') || '{}');
        if (saved.theme === 'dark' || saved.theme === 'light') theme = saved.theme;
      } catch (_) {}
      document.documentElement.classList.toggle('light', theme === 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#ede6d8' : '#07100c');
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=17" />
  <title>Partija</title>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="./app.js?v=17" defer></script>
</body>
</html>
